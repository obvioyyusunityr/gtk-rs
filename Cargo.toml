[package]
name = "gtk-sidebar"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = {version = "2", features = ["json"]}
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
adw = {package = "libadwaita", version = "0.9", features =["v1_8"]}
webkit6 = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
